# Cloudflare Pages 生产配置：只需要 D1 绑定。
# 业务配置（上传限制、数据保留、清理间隔、站点域名）全部存在 site_settings 表里，
# 由站点后台的「网站设置 → 运行配置」维护；环境变量只有三个引导项：
#   EDGECHAT_ADMIN_USERNAME / EDGECHAT_ADMIN_PASSWORD / EDGECHAT_ENCRYPTION_KEYRING
#
# 注意：`wrangler pages deploy` 不接受自定义配置路径（--config 会直接报错），
# 所以部署命令只传目录与 --project-name；需要这份配置的是 `wrangler d1 execute` 之类的命令。
name = "edgechat"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
# Legacy D1 resource name kept intentionally; do not rename without a data migration plan.
database_name = "cfchat-db"
database_id = "0d012571-bc6f-4cf2-90fe-e480a14369b3"
