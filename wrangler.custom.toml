name = "cfchat"
main = "worker/src/index.ts"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "chat.cnz.kdns.fr", custom_domain = true }
]

[build]
command = "npm run schema:generate"

[vars]
ADMIN_USERNAMES = "admin"
MESSAGE_RETENTION_DAYS = "7"
SOFT_DELETE_RETENTION_DAYS = "60"
GC_BATCH_SIZE = "90"
GC_MAX_BATCHES_PER_RUN = "20"
GC_INTERNAL_OPERATION_BUDGET = "900"
GC_D1_STATEMENT_BUDGET = "1200"
GC_R2_OPERATION_BUDGET = "300"
SITE_ORIGINS = "https://chat.cnz.kdns.fr"
R2_DELETE_MAX_RETRY = "8"
ORPHAN_UPLOAD_RETENTION_DAYS = "1"
ALLOWED_FILE_TYPES = "image/,video/,audio/,application/pdf,text/"
MAX_FILE_SIZE = "20971520"

[[d1_databases]]
binding = "DB"
database_name = "cfchat-db"
database_id = "0d012571-bc6f-4cf2-90fe-e480a14369b3"

[[kv_namespaces]]
binding = "SESSIONS"
id = "0342abdfa2b44befac1599a1eaa13b70"

[[r2_buckets]]
binding = "FILES"
bucket_name = "cfchat-files"

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[triggers]
crons = ["0 19 * * *"]
