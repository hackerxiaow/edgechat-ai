name: Deploy Pages
on:
  push:
    branches:
      - master
      - main
    paths:
      - "worker/**"
      - "frontend/**"
      - "shared/**"
      - "test/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - "wrangler.pages.toml"
  workflow_dispatch:
    inputs:
      apply_encryption_keyring:
        description: Apply EDGECHAT_ENCRYPTION_KEYRING, retaining every old key ID during rotation
        required: false
        default: false
        type: boolean
      rotate_encryption_key:
        description: Add a new automatic key and make it active while retaining every old key
        required: false
        default: false
        type: boolean
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # Pages 的 _worker.js 与静态资产一起上传；构建本身不需要 Cloudflare 凭据。
      - name: Build Pages bundle
        run: npm run build:pages
      - name: Ensure Cloudflare resources
        id: ensure_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGECHAT_PAGES_PROJECT_NAME: ${{ vars.EDGECHAT_PAGES_PROJECT_NAME || 'edgechat' }}
        run: node .github/scripts/ensure-cloudflare-resources.mjs
      - name: Initialize D1 schema (first creation only)
        if: steps.ensure_resources.outputs.d1_created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/schema.sql --config wrangler.pages.toml
      - name: Prepare D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGECHAT_D1_DATABASE_ID: ${{ steps.ensure_resources.outputs.d1_database_id }}
        run: node .github/scripts/prepare-d1-migrations.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file .tmp/edgechat-d1-migrations.sql --config wrangler.pages.toml
      - name: Verify D1 schema contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGECHAT_D1_DATABASE_ID: ${{ steps.ensure_resources.outputs.d1_database_id }}
        run: node .github/scripts/prepare-d1-migrations.mjs --verify
      - name: Prepare Pages encryption secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGECHAT_DEPLOY_TARGET: pages
          EDGECHAT_PAGES_PROJECT_NAME: ${{ steps.ensure_resources.outputs.pages_project_name }}
          EDGECHAT_SECRETS_FILE: .tmp/pages-secrets.json
          EDGECHAT_ENCRYPTION_KEYRING: ${{ secrets.EDGECHAT_ENCRYPTION_KEYRING }}
          EDGECHAT_APPLY_ENCRYPTION_KEYRING: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_encryption_keyring || false }}
          EDGECHAT_ROTATE_ENCRYPTION_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_encryption_key || false }}
        run: node .github/scripts/prepare-encryption-secret.mjs
      - name: Apply Pages encryption secret
        if: hashFiles('.tmp/pages-secrets.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages secret bulk .tmp/pages-secrets.json --project-name ${{ steps.ensure_resources.outputs.pages_project_name }}
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pages 命令不支持 --config，目录与项目名只能走命令行参数。
        run: npx wrangler pages deploy frontend/dist --project-name ${{ steps.ensure_resources.outputs.pages_project_name }}
      - name: Remove temporary secret files
        if: always()
        shell: bash
        run: rm -f .tmp/pages-secrets.json
